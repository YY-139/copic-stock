<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>コピック在庫管理</title>

<style>
  body{
    margin:0;
    font-family:sans-serif;
    background:#f5f5f5;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .toolbar{
    position:sticky;
    top:0;
    width:100%;
    background:white;
    padding:10px;
    box-shadow:0 2px 6px rgba(0,0,0,.1);
    display:flex;
    gap:10px;
    justify-content:center;
    z-index:1000;
  }

  button{
    padding:10px 16px;
    border:none;
    border-radius:10px;
    background:#333;
    color:white;
    font-size:16px;
    cursor:pointer;
  }

  .board{
    position:relative;
    width:min(100vw, 900px);
  }

  .board img{
    width:100%;
    display:block;
  }

  .counter{
  position:absolute;
  width:30px;
  height:30px;
  border-radius:50%;
  background:#ffffffee;
  color:#111;
  border:2px solid #333;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  font-size:14px;
  cursor:pointer;
  user-select:none;
  box-shadow:0 1px 3px rgba(0,0,0,.25);
  transform:translate(-50%,-50%);
}
  .counter.zero{
    background:#ffdddd;
    border-color:#d00;
    color:#900;
  }
</style>
</head>

<body>

<div class="toolbar">
  <button onclick="location.href='index.html'">← 戻る</button>
  <button onclick="resetStock()">リセット</button>
  <button onclick="window.print()">PDF出力</button>
</div>

<div class="board" id="board">
  <img src="copicsketch.png" alt="コピックスケッチ">
</div>

<script>
// ここに色の位置を追加していく
const markers = [
  { code:'BV00', x:15, y:18.3 },
  { code:'BV04', x:25, y:18.3 },
  { code:'BV08', x:35, y:18.3 },
  { code:'BV23', x:45, y:18.3 },
  { code:'BV31', x:55, y:18.3 }
];

const board = document.getElementById('board');

function getStock(code){
  return Number(localStorage.getItem(code) || 0);
}

function updateDisplay(el, value){
  el.textContent = value;
  el.classList.toggle('zero', value === 0);
}

markers.forEach(m => {
  const el = document.createElement('div');
  el.className = 'counter';
  el.style.left = m.x + '%';
  el.style.top  = m.y + '%';

  let value = getStock(m.code);
  updateDisplay(el, value);

  let lastTap = 0;
// シングルクリック
el.addEventListener('click', () => {
  const now = Date.now();

  // 300ms以内ならダブルタップ
  if (now - lastTap < 300) {
    value = Math.max(0, value - 2);
  } else {
    value++;
  }

  lastTap = now;
  localStorage.setItem(m.code, value);
  updateDisplay(el, value);
});

  // ←これが超重要！画面に追加してる
  board.appendChild(el);
});

function resetStock(){
  if(confirm('在庫をすべて0にしますか？')){
    markers.forEach(m => localStorage.removeItem(m.code));
    location.reload();
  }
}
</script>

</body>
</html>
