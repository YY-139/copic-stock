<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>コピック在庫管理</title>

<style>
  body{
    margin:0;
    font-family:sans-serif;
    background:#f5f5f5;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .toolbar{
    position:sticky;
    top:0;
    width:100%;
    background:white;
    padding:10px;
    box-shadow:0 2px 6px rgba(0,0,0,.1);
    display:flex;
    gap:10px;
    justify-content:center;
    z-index:1000;
  }

  button{
    padding:10px 16px;
    border:none;
    border-radius:10px;
    background:#333;
    color:white;
    font-size:16px;
    cursor:pointer;
  }

  .board{
    position:relative;
    width:min(100vw, 900px);
  }

  .board img{
    width:100%;
    display:block;
  }

  .counter{
  position:absolute;
  width:30px;
  height:30px;
  border-radius:50%;
  background: rgba(255,255,255,0.20);
  color:#FF0000;
  border:2px solid #FF0000;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  font-size:14px;
  cursor:pointer;
  user-select:none;
  transform:translate(-50%,-50%);
  text-shadow:
    -1px -1px 0 #fff,
     1px -1px 0 #fff,
    -1px  1px 0 #fff,
     1px  1px 0 #fff;
  backdrop-filter: blur(2px);
 }

  .counter.zero{
    background: rgba(255,255,255,0.20);
    border-color:#FF0000;
    color:#FF0000;
  }
</style>
</head>

<body>

<div class="toolbar">
  <button onclick="location.href='index.html'">← 戻る</button>
  <button onclick="resetStock()">リセット</button>
  <button onclick="window.print()">PDF出力</button>
</div>

<div class="board" id="board">
  <img src="copicsketch.png" alt="コピックスケッチ">
</div>

<script>
// ここに色の位置を追加していく
// コード一覧（色名は不要）
const codes = [
  'BV0000','BV000','BV00','BV01','BV02','BV04','BV08','BV11',
  'BV13','BV17','BV20','BV23','BV25','BV29','BV31','BV34',
  'V0000','V000','V01','V04','V05','V06','V09','V12',
  'V15','V17','V20','V22','V25','V28','V91','V93',
  'V95','V99','RV0000','RV000','RV00','RV02','RV04','RV06',
  'RV09','RV10','RV11','RV13','RV14','RV17','RV19','RV21',
  'RV23','RV25','RV29','RV32','RV34','RV42','RV52','RV55',
  'RV63','RV66','RV69','RV91','RV93','RV95','RV99','R0000',
  'R000','R00','R01','R02','R05','R08','R11','R12',
  'R14','R17','R20','R21','R22','R24','R27','R29',
  'R30','R32','R35','R37','R39','R43','R46','R56',
  'R59','R81','R83','R85','R89','YR0000','YR000','YR00',
  'YR01','YR02','YR04','YR07','YR09','YR12','YR14','YR15',
  'YR16','YR18','YR20','YR21','YR23','YR24','YR27','YR30',
  'YR31','YR61','YR65','YR68','YR82','Y0000','Y000','Y00',
  'Y02','Y04','Y06','Y08','Y11','Y13','Y15','Y17',
  'Y18','Y19','Y21','Y23','Y26','Y28','Y32','Y35',
  'Y38','YG0000','YG00','YG01','YG03','YG05','YG06','YG07',
  'YG09','YG11','YG13','YG17','YG21','YG23','YG25','YG41',
  'YG45','YG61','YG63','YG67','YG91','YG93','YG95','YG97',
  'YG99','G0000','G000','G00','G02','G03','G05','G07',
  'G09','G12','G14','G16','G17','G19','G20','G21',
  'G24','G28','G29','G40','G43','G46','G82','G85',
  'G94','G99','BG0000','BG000','BG01','BG02','BG05','BG07',
  'BG09','BG10','BG11','BG13','BG15','BG18','BG23','BG32',
  'BG34','BG45','BG49','BG53','BG57','BG70','BG72','BG75',
  'BG78','BG90','BG93','BG96','BG99','B0000','B000','B00',
  'B01','B02','B04','B05','B06','B12','B14','B16',
  'B18','B21','B23','B24','B26','B28','B29','B32',
  'B34','B37','B39','B41','B45','B52','B60','B63',
  'B66','B69','B79','B91','B93','B95','B97','B99',
  'E0000','E000','E00','E01','E02','E04','E07','E08',
  'E09','E11','E13','E15','E17','E18','E19','E21',
  'E23','E25','E27','E29','E30','E31','E33','E34',
  'E35','E37','E39','E40','E41','E42','E43','E44',
  'E47','E49','E50','E51','E53','E55','E57','E59',
  'E70','E71','E74','E77','E79','E81','E84','E87',
  'E89','E93','E95','E97','E99','C-00','C-0','C-1',
  'C-2','C-3','C-4','C-5','C-6','C-7','C-8','C-9',
  'C-10','N-0','N-1','N-2','N-3','N-4','N-5','N-6',
  'N-7','N-8','N-9','N-10','T-0','T-1','T-2','T-3',
  'T-4','T-5','T-6','T-7','T-8','T-9','T-10','W-00',
  'W-0','W-1','W-2','W-3','W-4','W-5','W-6','W-7',
  'W-8','W-9','W-10','0','100','110','FV','FRV',
  'FYR','FY','FYG','FG','FBG','FB'
];

const cols = 8;
const startX = 15;
const startY = 10;
const stepX = 10;
const stepY = 3.045;

const totalRows = Math.ceil(codes.length / cols);
const lastRowCount = codes.length % cols || cols;

const markers = codes.map((code, index) => {
  const col = index % cols;
  const row = Math.floor(index / cols);

  // 最終行だけ中央寄せ
  let offset = 0;
  if (row === totalRows - 1 && lastRowCount < cols) {
    offset = ((cols - lastRowCount) * stepX) / 2;
  }

  return {
    code,
    x: startX + offset + col * stepX,
    y: startY + row * stepY
  };
});
  
const board = document.getElementById('board');

function getStock(code){
  return Number(localStorage.getItem(code) || 0);
}

function updateDisplay(el, value){
  el.textContent = value;
  el.classList.toggle('zero', value === 0);
}

markers.forEach(m => {
  const el = document.createElement('div');
  el.className = 'counter';
  el.style.left = m.x + '%';
  el.style.top  = m.y + '%';

  let value = getStock(m.code);
  updateDisplay(el, value);

  let lastTap = 0;
// シングルクリック
el.addEventListener('click', () => {
  const now = Date.now();

  // 300ms以内ならダブルタップ
  if (now - lastTap < 300) {
    value = Math.max(0, value - 2);
  } else {
    value++;
  }

  lastTap = now;
  localStorage.setItem(m.code, value);
  updateDisplay(el, value);
});

  // ←これが超重要！画面に追加してる
  board.appendChild(el);
});

function resetStock(){
  if(confirm('在庫をすべて0にしますか？')){
    markers.forEach(m => localStorage.removeItem(m.code));
    location.reload();
  }
}
</script>

</body>
</html>
