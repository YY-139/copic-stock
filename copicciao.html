<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>コピック在庫管理</title>

<style>
  body{
    margin:0;
    font-family:sans-serif;
    background:#f5f5f5;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .toolbar{
    position:sticky;
    top:0;
    width:100%;
    background:white;
    padding:10px;
    box-shadow:0 2px 6px rgba(0,0,0,.1);
    display:flex;
    gap:10px;
    justify-content:center;
    z-index:1000;
  }

  button{
    padding:10px 16px;
    border:none;
    border-radius:10px;
    background:#333;
    color:white;
    font-size:16px;
    cursor:pointer;
  }

  .board{
    position:relative;
    width:min(100vw, 900px);
  }

  .board img{
    width:100%;
    display:block;
  }

  .counter{
  position:absolute;
  width:30px;
  height:30px;
  border-radius:50%;
  background: rgba(255,255,255,0.20);
  color:#FF0000;
  border:2px solid #FF0000;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  font-size:14px;
  cursor:pointer;
  user-select:none;
  transform:translate(-50%,-50%);
  text-shadow:
    -1px -1px 0 #fff,
     1px -1px 0 #fff,
    -1px  1px 0 #fff,
     1px  1px 0 #fff;
 }

  .counter.zero{
    background: rgba(255,255,255,0.20);
    border-color:#FF0000;
    color:#FF0000;
  }

  @media print {
  @page {
    size: A4 portrait;
    margin: 0;
  }

  .toolbar{
    display:none !important;
  }

  body{
    background:white;
    margin:0;
  }

  .board{
    width:100%;
    margin:0;
  }
}
</style>
</head>

<body>

<div class="toolbar">
  <button onclick="location.href='index.html'">← 戻る</button>
  <button onclick="resetStock()">リセット</button>
  <button onclick="window.print()">PDF出力</button>
</div>

<div class="board" id="board">
  <img src="copicciao.png" alt="コピックチャオ">
</div>

<script>
// ここに色の位置を追加していく
// コード一覧（色名は不要）
const codes = [
  'BV000','BV00','BV02','BV04','BV08','BV13','BV17','BV23',
  'BV25','BV29','BV31','V000','V01','V04','V05','V06',
  'V09','V12','V15','V17','V91','V95','RV000','RV02',
  'RV04','RV06','RV10','RV13','RV14','RV21','RV23','RV29',
  'RV34','RV42','RV69','RV95','R000','R00','R02','R05',
  'R11','R14','R17','R20','R22','R27','R29','R32',
  'R35','R37','R46','R59','R81','R85','YR000','YR00',
  'YR02','YR04','YR07','YR15','YR16','YR20','YR23','YR31',
  'YR61','YR68','Y000','Y00','Y02','Y06','Y08','Y11',
  'Y15','Y17','Y21','Y28','Y35','Y38','YG00','YG03',
  'YG06','YG09','YG11','YG17','YG23','YG41','YG63','YG67',
  'YG91','YG95','G000','G00','G02','G05','G07','G14',
  'G17','G21','G28','G29','G82','G85','G94','G99',
  'BG000','BG01','BG05','BG09','BG10','BG13','BG15','BG23',
  'BG34','BG49','BG72','BG93','BG96','B000','B00','B02',
  'B05','B12','B18','B23','B24','B28','B29','B32',
  'B39','B45','B60','B63','B93','B95','B97','B99',
  'E000','E00','E02','E04','E08','E11','E15','E18',
  'E21','E25','E29','E31','E33','E35','E37','E40',
  'E41','E43','E47','E49','E50','E51','E53','E57',
  'E59','E71','E77','E79','E93','E95','C-0','C-1',
  'C-2','C-3','C-5','C-7','W-0','W-1','W-2','W-3',
  'W-5','W-7','0','100'
];

const cols = 8;
const startX = 15;
const startY = 21.05;
const stepX = 10;
const stepY = 3.466;

const totalRows = Math.ceil(codes.length / cols);
const lastRowCount = codes.length % cols || cols;

const markers = codes.map((code, index) => {
  const col = index % cols;
  const row = Math.floor(index / cols);

  // 最終行だけ中央寄せ
  let offset = 0;
  if (row === totalRows - 1 && lastRowCount < cols) {
    offset = ((cols - lastRowCount) * stepX) / 2;
  }

  return {
    code,
    x: startX + offset + col * stepX,
    y: startY + row * stepY
  };
});
  
const board = document.getElementById('board');

function getStock(code){
  return Number(localStorage.getItem(code) || 0);
}

function updateDisplay(el, value){
  el.textContent = value;
  el.classList.toggle('zero', value === 0);
}

const fragment = document.createDocumentFragment();

markers.forEach(m => {
  const el = document.createElement('div');
  el.className = 'counter';
  el.style.left = m.x + '%';
  el.style.top  = m.y + '%';

  let value = getStock(m.code);
  updateDisplay(el, value);

  let lastTap = 0;

  el.addEventListener('click', () => {
    const now = Date.now();

    if (now - lastTap < 300) {
      value = Math.max(0, value - 2);
    } else {
      value++;
    }

    lastTap = now;
    localStorage.setItem(m.code, value);
    updateDisplay(el, value);
  });

  fragment.appendChild(el);
});

// 最後に1回だけ追加
board.appendChild(fragment);


function resetStock(){
  if(confirm('在庫をすべて0にしますか？')){
    markers.forEach(m => localStorage.removeItem(m.code));
    location.reload();
  }
}
</script>

</body>
</html>
