<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>コピック在庫管理</title>

<style>
  body{
    margin:0;
    font-family:sans-serif;
    background:#f5f5f5;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .toolbar{
    position:sticky;
    top:0;
    width:100%;
    background:white;
    padding:10px;
    box-shadow:0 2px 6px rgba(0,0,0,.1);
    display:flex;
    gap:10px;
    justify-content:center;
    z-index:1000;
  }

  button{
    padding:10px 16px;
    border:none;
    border-radius:10px;
    background:#333;
    color:white;
    font-size:16px;
    cursor:pointer;
  }

  .board{
    position:relative;
    width:min(100vw, 900px);
  }

  .board img{
    width:100%;
    display:block;
  }

  .counter{
  position:absolute;
  width:30px;
  height:30px;
  border-radius:50%;
  background:#ffffffee;
  color:#111;
  border:2px solid #333;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  font-size:14px;
  cursor:pointer;
  user-select:none;
  box-shadow:0 1px 3px rgba(0,0,0,.25);
  transform:translate(-50%,-50%);
}
  .counter.zero{
    background:#ffdddd;
    border-color:#d00;
    color:#900;
  }
</style>
</head>

<body>

<div class="toolbar">
  <button onclick="resetStock()">リセット</button>
  <button onclick="window.print()">PDF出力</button>
</div>

<div class="board" id="board">
  <img src="copicclassic.png" alt="コピッククラシック">
</div>

<script>
// ここに色の位置を追加していく
const markers = [
  { code:'BV00', x:18, y:12 },
  { code:'BV04', x:27, y:12 },
  { code:'BV08', x:36, y:12 },
  { code:'V04',  x:45, y:12 },
  { code:'V09',  x:54, y:12 }
];

const board = document.getElementById('board');

function getStock(code){
  return Number(localStorage.getItem(code) || 0);
}

function setStock(code, value){
  localStorage.setItem(code, value);
}

function updateDisplay(el, value){
  el.textContent = value;
  el.classList.toggle('zero', value === 0);
}

markers.forEach(m => {
  const el = document.createElement('div');
  el.className = 'counter';
  el.style.left = m.x + '%';
  el.style.top  = m.y + '%';

  let value = getStock(m.code);
  updateDisplay(el, value);

  // タップで+1
  el.addEventListener('click', () => {
    value++;
    setStock(m.code, value);
    updateDisplay(el, value);
  });

  // 長押しで-1
  let timer;
  el.addEventListener('touchstart', () => {
    timer = setTimeout(() => {
      value = Math.max(0, value - 1);
      setStock(m.code, value);
      updateDisplay(el, value);
    }, 600);
  });

  el.addEventListener('touchend', () => clearTimeout(timer));
  el.addEventListener('mousedown', () => {
    timer = setTimeout(() => {
      value = Math.max(0, value - 1);
      setStock(m.code, value);
      updateDisplay(el, value);
    }, 600);
  });
  el.addEventListener('mouseup', () => clearTimeout(timer));

  board.appendChild(el);
});

function resetStock(){
  if(confirm('在庫をすべて0にしますか？')){
    markers.forEach(m => localStorage.removeItem(m.code));
    location.reload();
  }
}
</script>

</body>
</html>
